# ps2_recomp configuration skeleton for GT4 USA CORE (SCUS-97328), 2026-10-03.
# Modelled on GT3's gt3-analysis/core.toml. Run from the project folder (all paths are
# relative to that folder, as GT3's were relative to its project root):
#     recomp\out\tools\ps2xRecomp\ps2_recomp.exe analysis\recomp-prep\core-gt4.toml
# 2026-10-03 phase 3: stubs filled, rt_crypt rows added (CORE.elf now has .text.rt_crypt),
# reviewer fix: jump table 0x6bbc00 (jr 0x4da860) added.
#
# Inputs this file depends on (regenerate with the tools named):
#   game/CORE.elf                                  sha256 80708a3e...b7b0e5 (tools/core_to_elf_gt4.py; same bytes as 41ade3a3..., plus .text.rt_crypt section)
#   analysis/recomp-prep/core-functions-gt4.csv    tools/gt4_data_entry_points.py
#   analysis/recomp-prep/core-extra-entry-points.txt  tools/gt4_data_entry_points.py
#   [jump_tables] below                            copy of jump-tables-config.toml

[general]
input = "game/CORE.elf"

# GT3 wrote to gt3-analysis/core-generated and then copied the .cpp files into
# ps2xRuntime/src/runner_core with gt3-tools/merge_generated.py (which also merges the
# loader's function table). GT4 equivalent: generate here, then merge into
# recomp/ps2xRuntime/src/runner_core (that folder does not exist yet in the GT4 tree,
# and recomp/ps2xRuntime/CMakeLists.txt still lists GT3's runner_core files by name).
# Size estimate (inferred from GT3: 8,999 files = 150 MB): about 25k files, ~400 MB.
output = "analysis/core-generated"

# Ghidra's raw export is analysis/core.csv (24,616 rows, sha256 ca3f22c4...e4102f).
# Do NOT point at it directly: ExportPS2Functions.java writes End = max body address + 1,
# and 10 non-contiguous bodies give ranges up to 3 MB (FUN_001f3398 -> 0x4f0db0);
# ps2_recomp decodes [Start, End) linearly. core-functions-gt4*.csv = the same rows with
# End clamped to the next start, the 5 .data rows removed (ps2_recomp skips them anyway),
# plus 17 recovered starts (extra-functions.csv, Recommended = 1).
# The "-authoritative" file renames auto names (FUN_/sub_/LAB_/DAT_) to gt4f_<addr>:
# ps2_recomp's ElfParser keeps map ranges exactly only for non-auto names; for auto-named
# rows that are also jal targets it uses End = max(map End, next jal target) from its
# jal-target fallback scan (9,628 rows, 1.77 MB decoded twice). Subset test 0x4de000..
# 0x4e3000: auto names -> sub_004DF620 swallowed 20 functions (2.4 MB output, 23 unresolved
# JR); authoritative -> 1 unresolved JR (predicted), 3 new functions (predicted), 1.3 MB.
# GT3 used auto names (that is where its sub_ functions came from). Decide before the
# first full run; the GT3-compatible alternative is core-functions-gt4.csv.
ghidra_output = "analysis/recomp-prep/core-functions-gt4-authoritative.csv"

# Pointer-only entries (GT3: 3,830, option added 2026-09-25). One address per line,
# '#' comment. Inside a decoded function -> resumable label; outside every function at a
# real boundary (jr $ra / j + delay slot + <= 3 zero words) -> new function.
extra_entry_points_file = "analysis/recomp-prep/core-extra-entry-points.txt"

single_file_output = false
# GT3 used low_memory_mode = true with 2 output workers; GT4 is ~2.7x the function count.
low_memory_mode = true
output_worker_threads = 2

# Same patch policy as GT3 (syscalls are handled from the instruction, COP0 and CACHE patched).
patch_syscalls = false
patch_cop0 = true
patch_cache = true

# To be drafted by the stub/binding pass (analysis/core.toml from the Ghidra export
