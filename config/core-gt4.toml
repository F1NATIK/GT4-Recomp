# Jump tables whose base ps2_recomp finds but whose case count it does not (no sll
# before the addu, the index was scaled earlier). ps2_recomp reads [jump_tables] only
# when its own scan computes the same table address. 4 tables, from jump-tables-config.toml.
[jump_tables]

[[jump_tables.table]]
# jr at 0x4deb30 in FUN_004de8b8, bound slti 9
